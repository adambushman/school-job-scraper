[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "school-job-scraper"
version = "0.1.0"
description = "Daily scan of Weber, Davis and Ogden school district job boards for full-time elementary teacher openings."
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["black>=24", "mypy>=1.8", "pytest>=8", "pytest-cov>=4", "types-requests>=2.31"]

[project.scripts]
school-job-scraper = "school_job_scraper.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true
no_implicit_reexport = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
